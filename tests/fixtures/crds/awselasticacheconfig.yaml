---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: elasticacheconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ElastiCacheConfig
    listKind: ElastiCacheConfigList
    plural: elasticacheconfigs
    singular: elasticacheconfig
    shortNames:
      - awselasticachecfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.atRestEncryptionEnabled) &&
                  self.spec.mandatory.atRestEncryptionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.atRestEncryptionEnabled) &&
                  self.spec.defaults.atRestEncryptionEnabled == true)
              message: >-
                atRestEncryptionEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.transitEncryptionEnabled) &&
                  self.spec.mandatory.transitEncryptionEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.transitEncryptionEnabled) &&
                  self.spec.defaults.transitEncryptionEnabled == true)
              message: >-
                transitEncryptionEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.automaticFailoverEnabled) &&
                  self.spec.mandatory.automaticFailoverEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.automaticFailoverEnabled) &&
                  self.spec.defaults.automaticFailoverEnabled == true)
              message: >-
                automaticFailoverEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.multiAZEnabled) &&
                  self.spec.mandatory.multiAZEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.multiAZEnabled) &&
                  self.spec.defaults.multiAZEnabled == true)
              message: >-
                multiAZEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engine) &&
                  self.spec.mandatory.engine != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engine) &&
                  self.spec.defaults.engine != "")
              message: >-
                engine cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.blockNoPasswordUsers) &&
                  self.spec.mandatory.blockNoPasswordUsers == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.blockNoPasswordUsers) &&
                  self.spec.defaults.blockNoPasswordUsers == true)
              message: >-
                blockNoPasswordUsers cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.snapshotRetentionLimit) &&
                  self.spec.mandatory.snapshotRetentionLimit > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.snapshotRetentionLimit) &&
                  self.spec.defaults.snapshotRetentionLimit > 0)
              message: >-
                snapshotRetentionLimit cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory ElastiCache governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    atRestEncryptionEnabled:
                      type: boolean
                      description: >-
                        Enforce encryption at rest. Omit (nil) = not enforced;
                        false = explicitly disabled. No scalar default — nil (*bool)
                        detection required for the cascade priority chain.
                    transitEncryptionEnabled:
                      type: boolean
                      description: >-
                        Enforce encryption in transit. Omit (nil) = not enforced.
                    automaticFailoverEnabled:
                      type: boolean
                      description: >-
                        Enforce automatic failover. Omit (nil) = not enforced.
                        No KropathConfig.elasticache equivalent.
                    multiAZEnabled:
                      type: boolean
                      description: >-
                        Enforce Multi-AZ deployment. Omit (nil) = not enforced.
                        No KropathConfig.elasticache equivalent.
                    engine:
                      type: string
                      description: >-
                        Restrict cache engine ("valkey", "redis", "memcached").
                        Empty = not enforced. No KropathConfig.elasticache equivalent.
                    blockNoPasswordUsers:
                      type: boolean
                      description: >-
                        Prevent creation of users without password authentication.
                        Omit (nil) = not enforced. No KropathConfig.elasticache equivalent.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      description: >-
                        Minimum snapshot retention in days. 0 = not enforced.
                        No KropathConfig.elasticache equivalent.
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        No KropathConfig.elasticache equivalent.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default ElastiCache governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    atRestEncryptionEnabled:
                      type: boolean
                      description: >-
                        Default encryption at rest setting. Omit (nil) = no default.
                    transitEncryptionEnabled:
                      type: boolean
                      description: >-
                        Default encryption in transit setting. Omit (nil) = no default.
                    automaticFailoverEnabled:
                      type: boolean
                      description: >-
                        Default automatic failover setting. Omit (nil) = no default.
                    multiAZEnabled:
                      type: boolean
                      description: >-
                        Default Multi-AZ setting. Omit (nil) = no default.
                    engine:
                      type: string
                      description: >-
                        Default cache engine. Empty = no default.
                    blockNoPasswordUsers:
                      type: boolean
                      description: >-
                        Default no-password block setting. Omit (nil) = no default.
                    snapshotRetentionLimit:
                      type: integer
                      format: int64
                      description: >-
                        Default snapshot retention in days. 0 = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged ElastiCache governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        atRestEncryptionEnabled:
                          type: boolean
                        transitEncryptionEnabled:
                          type: boolean
                        automaticFailoverEnabled:
                          type: boolean
                        multiAZEnabled:
                          type: boolean
                        engine:
                          type: string
                        blockNoPasswordUsers:
                          type: boolean
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        atRestEncryptionEnabled:
                          type: boolean
                        transitEncryptionEnabled:
                          type: boolean
                        automaticFailoverEnabled:
                          type: boolean
                        multiAZEnabled:
                          type: boolean
                        engine:
                          type: string
                        blockNoPasswordUsers:
                          type: boolean
                        snapshotRetentionLimit:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
