---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backupconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: BackupConfig
    listKind: BackupConfigList
    plural: backupconfigs
    singular: backupconfig
    shortNames:
      - awsbackupcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionKeyARN) &&
                  self.spec.mandatory.encryptionKeyARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionKeyARN) &&
                  self.spec.defaults.encryptionKeyARN != "")
              message: >-
                encryptionKeyARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.vaultLockMinRetentionDays) &&
                  self.spec.mandatory.vaultLockMinRetentionDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.vaultLockMinRetentionDays) &&
                  self.spec.defaults.vaultLockMinRetentionDays > 0)
              message: >-
                vaultLockMinRetentionDays cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.vaultLockMaxRetentionDays) &&
                  self.spec.mandatory.vaultLockMaxRetentionDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.vaultLockMaxRetentionDays) &&
                  self.spec.defaults.vaultLockMaxRetentionDays > 0)
              message: >-
                vaultLockMaxRetentionDays cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableContinuousBackup) &&
                  self.spec.mandatory.enableContinuousBackup == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableContinuousBackup) &&
                  self.spec.defaults.enableContinuousBackup == true)
              message: >-
                enableContinuousBackup cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultLifecycleDeleteAfterDays) &&
                  self.spec.mandatory.defaultLifecycleDeleteAfterDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultLifecycleDeleteAfterDays) &&
                  self.spec.defaults.defaultLifecycleDeleteAfterDays > 0)
              message: >-
                defaultLifecycleDeleteAfterDays cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.defaultLifecycleMoveToColdStorageAfterDays) &&
                  self.spec.mandatory.defaultLifecycleMoveToColdStorageAfterDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.defaultLifecycleMoveToColdStorageAfterDays) &&
                  self.spec.defaults.defaultLifecycleMoveToColdStorageAfterDays > 0)
              message: >-
                defaultLifecycleMoveToColdStorageAfterDays cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableMalwareScan) &&
                  self.spec.mandatory.enableMalwareScan == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableMalwareScan) &&
                  self.spec.defaults.enableMalwareScan == true)
              message: >-
                enableMalwareScan cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.scannerRoleARN) &&
                  self.spec.mandatory.scannerRoleARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.scannerRoleARN) &&
                  self.spec.defaults.scannerRoleARN != "")
              message: >-
                scannerRoleARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.iamRoleARN) &&
                  self.spec.mandatory.iamRoleARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.iamRoleARN) &&
                  self.spec.defaults.iamRoleARN != "")
              message: >-
                iamRoleARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Backup governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    encryptionKeyARN:
                      type: string
                      description: Empty string = not enforced.
                    vaultLockMinRetentionDays:
                      type: integer
                      format: int64
                      description: 0 = not enforced.
                    vaultLockMaxRetentionDays:
                      type: integer
                      format: int64
                      description: 0 = not enforced.
                    enableContinuousBackup:
                      type: boolean
                      description: When true, continuous backup is enforced. false = not enforced.
                    defaultLifecycleDeleteAfterDays:
                      type: integer
                      format: int64
                      description: 0 = not enforced.
                    defaultLifecycleMoveToColdStorageAfterDays:
                      type: integer
                      format: int64
                      description: 0 = not enforced.
                    enableMalwareScan:
                      type: boolean
                      description: When true, malware scan is enforced. false = not enforced.
                    scannerRoleARN:
                      type: string
                      description: Empty string = not enforced.
                    iamRoleARN:
                      type: string
                      description: Empty string = not enforced.
                    namingTemplate:
                      type: string
                      description: Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Backup governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    encryptionKeyARN:
                      type: string
                      description: Default encryption key ARN. Empty string = no default.
                    vaultLockMinRetentionDays:
                      type: integer
                      format: int64
                      description: Default vault lock min retention in days. 0 = no default.
                    vaultLockMaxRetentionDays:
                      type: integer
                      format: int64
                      description: Default vault lock max retention in days. 0 = no default.
                    enableContinuousBackup:
                      type: boolean
                      description: Default continuous backup toggle.
                    defaultLifecycleDeleteAfterDays:
                      type: integer
                      format: int64
                      description: Default lifecycle delete after days. 0 = no default.
                    defaultLifecycleMoveToColdStorageAfterDays:
                      type: integer
                      format: int64
                      description: Default lifecycle move to cold storage after days. 0 = no default.
                    enableMalwareScan:
                      type: boolean
                      description: Default malware scan toggle.
                    scannerRoleARN:
                      type: string
                      description: Default scanner role ARN. Empty string = no default.
                    iamRoleARN:
                      type: string
                      description: Default IAM role ARN. Empty string = no default.
                    namingTemplate:
                      type: string
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged governance config written by kropath-aws-controller. RGDs read
                    exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionKeyARN:
                          type: string
                        vaultLockMinRetentionDays:
                          type: integer
                          format: int64
                        vaultLockMaxRetentionDays:
                          type: integer
                          format: int64
                        enableContinuousBackup:
                          type: boolean
                        defaultLifecycleDeleteAfterDays:
                          type: integer
                          format: int64
                        defaultLifecycleMoveToColdStorageAfterDays:
                          type: integer
                          format: int64
                        enableMalwareScan:
                          type: boolean
                        scannerRoleARN:
                          type: string
                        iamRoleARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionKeyARN:
                          type: string
                        vaultLockMinRetentionDays:
                          type: integer
                          format: int64
                        vaultLockMaxRetentionDays:
                          type: integer
                          format: int64
                        enableContinuousBackup:
                          type: boolean
                        defaultLifecycleDeleteAfterDays:
                          type: integer
                          format: int64
                        defaultLifecycleMoveToColdStorageAfterDays:
                          type: integer
                          format: int64
                        enableMalwareScan:
                          type: boolean
                        scannerRoleARN:
                          type: string
                        iamRoleARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
