# Assert AC-3: mandatory.tags={"cost-centre":"infra"} from KropathConfig level 1;
# defaults.namingTemplate="{namespace}-{name}" merged in from the global SESConfig
# counterpart (level 7) since the local CR sets no defaults of its own.
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: ac03-ses-config
  namespace: ac03-ses-app-ns
status:
  effectiveConfig:
    mandatory:
      tags:
        cost-centre: infra
    defaults:
      namingTemplate: "{namespace}-{name}"
