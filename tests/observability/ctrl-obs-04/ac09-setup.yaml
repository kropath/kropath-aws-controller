# AC-9: three refs to distinct absent objects of installed kinds. M-10's
# collect-all change means all three get a resolveRef attempt (and therefore
# a kropath_policydocument_unresolved_refs count of 3, not 1).
apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac09-doc
  namespace: default
spec:
  statements:
    - effect: Allow
      actions: ["s3:GetObject"]
      resources:
        - ref:
            kind: AWSIAMRole
            name: ac09-missing-role
        - ref:
            kind: AWSS3Bucket
            name: ac09-missing-bucket
        - ref:
            kind: AWSSQSQueue
            name: ac09-missing-queue
