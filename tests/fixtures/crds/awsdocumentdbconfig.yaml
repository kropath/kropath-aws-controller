---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: documentdbconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: DocumentDBConfig
    listKind: DocumentDBConfigList
    plural: documentdbconfigs
    singular: documentdbconfig
    shortNames:
      - awsdocdbcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageEncrypted) &&
                  self.spec.mandatory.storageEncrypted == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageEncrypted) &&
                  self.spec.defaults.storageEncrypted == true)
              message: >-
                storageEncrypted cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.deletionProtection) &&
                  self.spec.mandatory.deletionProtection == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.deletionProtection) &&
                  self.spec.defaults.deletionProtection == true)
              message: >-
                deletionProtection cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsKeyArn) &&
                  self.spec.mandatory.kmsKeyArn != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsKeyArn) &&
                  self.spec.defaults.kmsKeyArn != "")
              message: >-
                kmsKeyArn cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.performanceInsightsEnabled) &&
                  self.spec.mandatory.performanceInsightsEnabled == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.performanceInsightsEnabled) &&
                  self.spec.defaults.performanceInsightsEnabled == true)
              message: >-
                performanceInsightsEnabled cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.dbInstanceClass) &&
                  self.spec.mandatory.dbInstanceClass != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.dbInstanceClass) &&
                  self.spec.defaults.dbInstanceClass != "")
              message: >-
                dbInstanceClass cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.engineVersion) &&
                  self.spec.mandatory.engineVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.engineVersion) &&
                  self.spec.defaults.engineVersion != "")
              message: >-
                engineVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedInstanceClasses) &&
                  size(self.spec.mandatory.allowedInstanceClasses) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedInstanceClasses) &&
                  size(self.spec.defaults.allowedInstanceClasses) > 0)
              message: >-
                allowedInstanceClasses cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.storageType) &&
                  self.spec.mandatory.storageType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.storageType) &&
                  self.spec.defaults.storageType != "")
              message: >-
                storageType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.backupRetentionPeriod) &&
                  self.spec.mandatory.backupRetentionPeriod > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.backupRetentionPeriod) &&
                  self.spec.defaults.backupRetentionPeriod > 0)
              message: >-
                backupRetentionPeriod cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enableCloudwatchLogsExports) &&
                  size(self.spec.mandatory.enableCloudwatchLogsExports) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.enableCloudwatchLogsExports) &&
                  size(self.spec.defaults.enableCloudwatchLogsExports) > 0)
              message: >-
                enableCloudwatchLogsExports cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory DocumentDB governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    storageEncrypted:
                      type: boolean
                      description: >-
                        Enforce storage encryption for all DocumentDB clusters. Omit (nil) = not enforced.
                    deletionProtection:
                      type: boolean
                      description: >-
                        Enforce deletion protection on all DocumentDB clusters. Omit (nil) = not enforced.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Force a specific KMS key ARN for encryption at rest. Empty = not enforced.
                        No KropathConfig.documentdb equivalent.
                    performanceInsightsEnabled:
                      type: boolean
                      description: >-
                        Enforce Performance Insights. Omit (nil) = not enforced.
                        No KropathConfig.documentdb equivalent.
                    dbInstanceClass:
                      type: string
                      description: >-
                        Force a specific instance class (e.g. "db.r6g.large"). Empty = not enforced.
                        No KropathConfig.documentdb equivalent.
                    engineVersion:
                      type: string
                      description: >-
                        Force a specific DocumentDB engine version. Empty = not enforced.
                        No KropathConfig.documentdb equivalent.
                    allowedInstanceClasses:
                      type: array
                      description: >-
                        Restrict instance classes to an allowlist. Empty = no restriction.
                      items:
                        type: string
                    storageType:
                      type: string
                      description: >-
                        Force a specific storage type (e.g. "standard", "iopt1"). Empty = not enforced.
                        No KropathConfig.documentdb equivalent.
                    backupRetentionPeriod:
                      type: integer
                      format: int64
                      description: >-
                        Minimum backup retention floor in days. 0 = not enforced.
                    enableCloudwatchLogsExports:
                      type: array
                      description: >-
                        Force specific CloudWatch log export types. Empty = not enforced.
                        No KropathConfig.documentdb equivalent.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        No KropathConfig.documentdb equivalent.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default DocumentDB governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    storageEncrypted:
                      type: boolean
                      description: >-
                        Default storage encryption setting. Omit (nil) = no default.
                    deletionProtection:
                      type: boolean
                      description: >-
                        Default deletion protection setting. Omit (nil) = no default.
                    kmsKeyArn:
                      type: string
                      description: >-
                        Default KMS key ARN. Empty = no default.
                    performanceInsightsEnabled:
                      type: boolean
                      description: >-
                        Default Performance Insights setting. Omit (nil) = no default.
                    dbInstanceClass:
                      type: string
                      description: >-
                        Default instance class. Empty = no default.
                    engineVersion:
                      type: string
                      description: >-
                        Default engine version. Empty = no default.
                    allowedInstanceClasses:
                      type: array
                      description: >-
                        Default instance class allowlist. Empty = no default.
                      items:
                        type: string
                    storageType:
                      type: string
                      description: >-
                        Default storage type. Empty = no default.
                    backupRetentionPeriod:
                      type: integer
                      format: int64
                      description: >-
                        Default backup retention in days. 0 = no default.
                    enableCloudwatchLogsExports:
                      type: array
                      description: >-
                        Default CloudWatch log export types. Empty = no default.
                      items:
                        type: string
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged DocumentDB governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        storageEncrypted:
                          type: boolean
                        deletionProtection:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        performanceInsightsEnabled:
                          type: boolean
                        dbInstanceClass:
                          type: string
                        engineVersion:
                          type: string
                        allowedInstanceClasses:
                          type: array
                          items:
                            type: string
                        storageType:
                          type: string
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                        enableCloudwatchLogsExports:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        storageEncrypted:
                          type: boolean
                        deletionProtection:
                          type: boolean
                        kmsKeyArn:
                          type: string
                        performanceInsightsEnabled:
                          type: boolean
                        dbInstanceClass:
                          type: string
                        engineVersion:
                          type: string
                        allowedInstanceClasses:
                          type: array
                          items:
                            type: string
                        storageType:
                          type: string
                        backupRetentionPeriod:
                          type: integer
                          format: int64
                        enableCloudwatchLogsExports:
                          type: array
                          items:
                            type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
