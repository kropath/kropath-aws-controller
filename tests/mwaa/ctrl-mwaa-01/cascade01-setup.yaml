# MWAAConfig/cascade01-mwaa-env in the global namespace (defaults.namingTemplate set)
# plus MWAAConfig/cascade01-mwaa-env in the local (app) namespace (no fields of its
# own) plus KropathConfig.mandatory.mwaa.airflowVersion — the local CR's
# effectiveConfig picks up mandatory.airflowVersion from KropathConfig and
# defaults.namingTemplate from the global MWAAConfig counterpart.
apiVersion: v1
kind: Namespace
metadata:
  name: cascade01-mwaa-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: cascade01-mwaa-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: cascade01-mwaa-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: cascade01-mwaa-global-ns
spec:
  mandatory:
    mwaa:
      airflowVersion: "2.10.3"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MWAAConfig
metadata:
  name: cascade01-mwaa-env
  namespace: cascade01-mwaa-global-ns
spec:
  defaults:
    namingTemplate: "mwaa-{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: MWAAConfig
metadata:
  name: cascade01-mwaa-env
  namespace: cascade01-mwaa-app-ns
spec: {}
