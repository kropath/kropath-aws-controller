---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: stepfunctionsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: StepFunctionsConfig
    listKind: StepFunctionsConfigList
    plural: stepfunctionsconfigs
    singular: stepfunctionsconfig
    shortNames:
      - awssfncfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && self.spec.mandatory.loggingLevel != "" &&
                  has(self.spec.defaults) && self.spec.defaults.loggingLevel != "")
              message: >-
                loggingLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tracingEnabled) &&
                  has(self.spec.defaults) && has(self.spec.defaults.tracingEnabled))
              message: >-
                tracingEnabled cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.includeExecutionData) &&
                  has(self.spec.defaults) && has(self.spec.defaults.includeExecutionData))
              message: >-
                includeExecutionData cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Step Functions governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    loggingLevel:
                      type: string
                      default: ""
                      description: >-
                        Mandatory execution logging level. "" = not enforced.
                        Valid values: "" | "ALL" | "ERROR" | "FATAL" | "OFF".
                    tracingEnabled:
                      type: boolean
                      description: >-
                        Mandatory X-Ray tracing enforcement. Omit (nil) = not enforced;
                        false = explicitly disabled.
                    includeExecutionData:
                      type: boolean
                      description: >-
                        Mandatory execution data inclusion enforcement. Omit (nil) = not enforced;
                        false = explicitly disabled.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Step Functions resource naming template. Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Step Functions governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    loggingLevel:
                      type: string
                      default: ""
                      description: >-
                        Default execution logging level. "" = no default (RGD built-in default applies).
                        Valid values: "" | "ALL" | "ERROR" | "FATAL" | "OFF".
                    tracingEnabled:
                      type: boolean
                      description: >-
                        Default tracing preference. Omit (nil) = no default;
                        false = tracing disabled by default.
                    includeExecutionData:
                      type: boolean
                      description: >-
                        Default execution data inclusion preference. Omit (nil) = no default;
                        false = not included by default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged Step Functions governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        loggingLevel:
                          type: string
                        tracingEnabled:
                          type: boolean
                        includeExecutionData:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        loggingLevel:
                          type: string
                        tracingEnabled:
                          type: boolean
                        includeExecutionData:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
