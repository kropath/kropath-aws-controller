# AC-12: DocumentDBConfig/ac12-docdb-policy in the global namespace (defaults.namingTemplate
# set) plus DocumentDBConfig/ac12-docdb-policy in the local (app) namespace (no fields of
# its own) plus KropathConfig.mandatory.documentdb.storageEncrypted — the local CR's
# effectiveConfig picks up mandatory.storageEncrypted from KropathConfig and
# defaults.namingTemplate from the global DocumentDBConfig counterpart.
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-docdb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac12-docdb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac12-docdb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac12-docdb-global-ns
spec:
  mandatory:
    documentdb:
      storageEncrypted: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac12-docdb-policy
  namespace: ac12-docdb-global-ns
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac12-docdb-policy
  namespace: ac12-docdb-app-ns
spec: {}
