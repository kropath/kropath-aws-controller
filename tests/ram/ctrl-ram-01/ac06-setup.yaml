# AC-6: KropathConfig.mandatory.tags (level 1) + RAMConfig.mandatory.tags (level 4,
# the resource's own mandatory) merge additively into effCfg.mandatory.tags.
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-ram-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac06-ram-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac06-ram-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac06-ram-global-ns
spec:
  mandatory:
    tags:
      cost-centre: shared-services
---
apiVersion: aws.kropath.run/v1alpha1
kind: RAMConfig
metadata:
  name: ac06-ram-share
  namespace: ac06-ram-app-ns
spec:
  mandatory:
    tags:
      family: ram
