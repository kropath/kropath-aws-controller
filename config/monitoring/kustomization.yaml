#
# This kustomization is opt-in and is NOT referenced by any default deploy
# (design §10.3). Apply it with `make deploy-monitoring`, which requires the
# Prometheus Operator's PrometheusRule CRD to already be installed on the
# target cluster. The dashboard ships as a plain file for the consumer's own
# provisioning (e.g. a Grafana sidecar ConfigMap) and is intentionally not
# listed here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - prometheusrule.yaml
