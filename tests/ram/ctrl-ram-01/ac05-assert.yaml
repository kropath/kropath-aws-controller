# Assert AC-5: mandatory.allowExternalPrincipals=false from KropathConfig level 1;
# defaults.allowExternalPrincipals=true from the RAMConfig's own defaults (level 6).
apiVersion: aws.kropath.run/v1alpha1
kind: RAMConfig
metadata:
  name: ac05-ram-share
  namespace: ac05-ram-app-ns
status:
  effectiveConfig:
    mandatory:
      allowExternalPrincipals: false
    defaults:
      allowExternalPrincipals: true
