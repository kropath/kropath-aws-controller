---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ssmconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SSMConfig
    listKind: SSMConfigList
    plural: ssmconfigs
    singular: ssmconfig
    shortNames:
      - awsssmcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.type) &&
                  self.spec.mandatory.type != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.type) &&
                  self.spec.defaults.type != "")
              message: >-
                type cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.tier) &&
                  self.spec.mandatory.tier != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.tier) &&
                  self.spec.defaults.tier != "")
              message: >-
                tier cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.keyID) &&
                  self.spec.mandatory.keyID != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.keyID) &&
                  self.spec.defaults.keyID != "")
              message: >-
                keyID cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.documentType) &&
                  self.spec.mandatory.documentType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.documentType) &&
                  self.spec.defaults.documentType != "")
              message: >-
                documentType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.allowedDocumentTypes) &&
                  size(self.spec.mandatory.allowedDocumentTypes) > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.allowedDocumentTypes) &&
                  size(self.spec.defaults.allowedDocumentTypes) > 0)
              message: >-
                allowedDocumentTypes cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.operatingSystem) &&
                  self.spec.mandatory.operatingSystem != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.operatingSystem) &&
                  self.spec.defaults.operatingSystem != "")
              message: >-
                operatingSystem cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.approvedPatchesComplianceLevel) &&
                  self.spec.mandatory.approvedPatchesComplianceLevel != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.approvedPatchesComplianceLevel) &&
                  self.spec.defaults.approvedPatchesComplianceLevel != "")
              message: >-
                approvedPatchesComplianceLevel cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.rejectedPatchesAction) &&
                  self.spec.mandatory.rejectedPatchesAction != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.rejectedPatchesAction) &&
                  self.spec.defaults.rejectedPatchesAction != "")
              message: >-
                rejectedPatchesAction cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.approvedPatchesEnableNonSecurity) &&
                  self.spec.mandatory.approvedPatchesEnableNonSecurity == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.approvedPatchesEnableNonSecurity) &&
                  self.spec.defaults.approvedPatchesEnableNonSecurity == true)
              message: >-
                approvedPatchesEnableNonSecurity cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SSM governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    type:
                      type: string
                      description: >-
                        Force parameter type (String, StringList, SecureString). Empty = not enforced.
                    tier:
                      type: string
                      description: >-
                        Force parameter tier (Standard, Advanced, Intelligent-Tiering). Empty = not enforced.
                    keyID:
                      type: string
                      description: >-
                        KMS key ID or ARN for SecureString encryption. Empty = not enforced.
                    documentType:
                      type: string
                      description: >-
                        SSM document type for Patch Manager. Empty = not enforced.
                        No KropathConfig.ssm equivalent.
                    allowedDocumentTypes:
                      type: array
                      description: >-
                        Allowlist of SSM document types. Empty = no restriction.
                      items:
                        type: string
                    operatingSystem:
                      type: string
                      description: >-
                        Target OS for Patch Manager (e.g. WINDOWS, AMAZON_LINUX_2). Empty = not enforced.
                        No KropathConfig.ssm equivalent.
                    approvedPatchesComplianceLevel:
                      type: string
                      description: >-
                        Compliance level for approved patches (CRITICAL, HIGH, MEDIUM, LOW,
                        INFORMATIONAL, UNSPECIFIED). Empty = not enforced.
                        No KropathConfig.ssm equivalent.
                    rejectedPatchesAction:
                      type: string
                      description: >-
                        Action for rejected patches (ALLOW_AS_DEPENDENCY, BLOCK). Empty = not enforced.
                        No KropathConfig.ssm equivalent.
                    approvedPatchesEnableNonSecurity:
                      type: boolean
                      description: >-
                        Enforce whether non-security patches are approved. Omit (nil) = not enforced.
                        No KropathConfig.ssm equivalent.
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        No KropathConfig.ssm equivalent.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SSM governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    type:
                      type: string
                      description: >-
                        Default parameter type. Empty = no default.
                    tier:
                      type: string
                      description: >-
                        Default parameter tier. Empty = no default.
                    keyID:
                      type: string
                      description: >-
                        Default KMS key ID or ARN. Empty = no default.
                    documentType:
                      type: string
                      description: >-
                        Default document type. Empty = no default.
                    allowedDocumentTypes:
                      type: array
                      description: >-
                        Default document type allowlist. Empty = no default.
                      items:
                        type: string
                    operatingSystem:
                      type: string
                      description: >-
                        Default operating system. Empty = no default.
                    approvedPatchesComplianceLevel:
                      type: string
                      description: >-
                        Default compliance level. Empty = no default.
                    rejectedPatchesAction:
                      type: string
                      description: >-
                        Default rejected patches action. Empty = no default.
                    approvedPatchesEnableNonSecurity:
                      type: boolean
                      description: >-
                        Default non-security patches setting. Omit (nil) = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged SSM governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        type:
                          type: string
                        tier:
                          type: string
                        keyID:
                          type: string
                        documentType:
                          type: string
                        allowedDocumentTypes:
                          type: array
                          items:
                            type: string
                        operatingSystem:
                          type: string
                        approvedPatchesComplianceLevel:
                          type: string
                        rejectedPatchesAction:
                          type: string
                        approvedPatchesEnableNonSecurity:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        type:
                          type: string
                        tier:
                          type: string
                        keyID:
                          type: string
                        documentType:
                          type: string
                        allowedDocumentTypes:
                          type: array
                          items:
                            type: string
                        operatingSystem:
                          type: string
                        approvedPatchesComplianceLevel:
                          type: string
                        rejectedPatchesAction:
                          type: string
                        approvedPatchesEnableNonSecurity:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
