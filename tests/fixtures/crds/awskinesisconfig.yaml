---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kinesisconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: KinesisConfig
    listKind: KinesisConfigList
    plural: kinesisconfigs
    singular: kinesisconfig
    shortNames:
      - awskinconf
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.streamMode) &&
                  self.spec.mandatory.streamMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.streamMode) &&
                  self.spec.defaults.streamMode != "")
              message: >-
                streamMode cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.shardCount) &&
                  self.spec.mandatory.shardCount != 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.shardCount) &&
                  self.spec.defaults.shardCount != 0)
              message: >-
                shardCount cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Kinesis governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    streamMode:
                      type: string
                      description: >-
                        Enforce Kinesis stream mode ("PROVISIONED" or "ON_DEMAND").
                        Empty = not enforced.
                    shardCount:
                      type: integer
                      format: int64
                      description: >-
                        Enforce number of shards for PROVISIONED streams.
                        Zero = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        No KropathConfig.kinesis equivalent.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Kinesis governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    streamMode:
                      type: string
                      description: >-
                        Default Kinesis stream mode. Empty = no default.
                    shardCount:
                      type: integer
                      format: int64
                      description: >-
                        Default number of shards for PROVISIONED streams.
                        Zero = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged Kinesis governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        streamMode:
                          type: string
                        shardCount:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        streamMode:
                          type: string
                        shardCount:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
