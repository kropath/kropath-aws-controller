# ctrl-pipes-01 Chainsaw integration tests.
#
# aws-pipes-01-pipesconfig.md's Acceptance Criteria table (AC-1 through AC-8) covers
# only CRD-level x-kubernetes-validations and CR-inspection scenarios (tested in
# kropath-aws); it has no entry for the effectiveConfig cascade merge that its own
# Context section documents ("kropath-controller watches PipesConfig CRs alongside
# KropathConfig and writes...") and internal/cascade/pipes.go implements. This suite
# exercises that documented, implemented, but un-numbered behavior directly —
# flagged to Spec Analyst as a spec gap (every sibling *Config spec enumerates this
# as an AC; aws-pipes-01 does not).
#
# Requires a kind cluster with kropath-operator running and the fixture CRDs
# applied (`make chainsaw-start chainsaw-wait`, or just `make test-pipes`
# against an already-running controller).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-pipes-01
spec:
  description: "Pipes effectiveConfig cascade (ctrl-pipes-01)"
  steps:
    # KropathConfig.mandatory.pipes.desiredState (level 1) flows to
    # effCfg.mandatory.desiredState; global PipesConfig.defaults.namingTemplate
    # (level 7) flows to effCfg.defaults when the local CR sets no defaults of its own.
    - name: cascade01-effective-config-merge
      try:
        - apply:
            file: cascade01-setup.yaml
        - assert:
            file: cascade01-assert.yaml
            timeout: 30s

    # KropathConfig.mandatory.tags + PipesConfig.mandatory.tags merge additively.
    - name: cascade02-tag-merge
      try:
        - apply:
            file: cascade02-setup.yaml
        - assert:
            file: cascade02-assert.yaml
            timeout: 30s
