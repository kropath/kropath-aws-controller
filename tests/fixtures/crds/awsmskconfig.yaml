---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mskconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: MSKConfig
    listKind: MSKConfigList
    plural: mskconfigs
    singular: mskconfig
    shortNames:
      - awsmskcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kafkaVersion) &&
                  self.spec.mandatory.kafkaVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kafkaVersion) &&
                  self.spec.defaults.kafkaVersion != "")
              message: >-
                kafkaVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.instanceType) &&
                  self.spec.mandatory.instanceType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.instanceType) &&
                  self.spec.defaults.instanceType != "")
              message: >-
                instanceType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionAtRestKmsKeyId) &&
                  self.spec.mandatory.encryptionAtRestKmsKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionAtRestKmsKeyId) &&
                  self.spec.defaults.encryptionAtRestKmsKeyId != "")
              message: >-
                encryptionAtRestKmsKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionInTransitClientBroker) &&
                  self.spec.mandatory.encryptionInTransitClientBroker != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionInTransitClientBroker) &&
                  self.spec.defaults.encryptionInTransitClientBroker != "")
              message: >-
                encryptionInTransitClientBroker cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionInTransitInCluster) &&
                  self.spec.mandatory.encryptionInTransitInCluster != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionInTransitInCluster) &&
                  self.spec.defaults.encryptionInTransitInCluster != "")
              message: >-
                encryptionInTransitInCluster cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.enhancedMonitoring) &&
                  self.spec.mandatory.enhancedMonitoring != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.enhancedMonitoring) &&
                  self.spec.defaults.enhancedMonitoring != "")
              message: >-
                enhancedMonitoring cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory MSK governance fields. Zero-value / nil means the
                    field is not enforced at this tier.
                  properties:
                    kafkaVersion:
                      type: string
                      description: >-
                        Enforce a minimum Kafka version (e.g. "3.7.0"). Empty = not enforced.
                    instanceType:
                      type: string
                      description: >-
                        Enforce the broker EC2 instance type (e.g. "kafka.m5.large").
                        Empty = not enforced. No KropathConfig.msk equivalent.
                    encryptionAtRestKmsKeyId:
                      type: string
                      description: >-
                        Enforce a KMS key ARN for EBS encryption at rest.
                        Empty = not enforced.
                    encryptionInTransitClientBroker:
                      type: string
                      description: >-
                        Enforce client-broker encryption mode ("TLS", "TLS_PLAINTEXT", "PLAINTEXT").
                        Empty = not enforced.
                    encryptionInTransitInCluster:
                      type: string
                      description: >-
                        Enforce inter-broker encryption (three-state string: "true", "false").
                        Empty = not enforced (not the same as "false").
                    enhancedMonitoring:
                      type: string
                      description: >-
                        Enforce CloudWatch monitoring level ("DEFAULT", "PER_BROKER",
                        "PER_TOPIC_PER_BROKER", "PER_TOPIC_PER_PARTITION").
                        Empty = not enforced.
                    namingTemplate:
                      type: string
                      description: >-
                        Naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                        No KropathConfig.msk equivalent.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default MSK governance fields. Zero-value / nil means no
                    default is provided at this tier.
                  properties:
                    kafkaVersion:
                      type: string
                      description: >-
                        Default Kafka version. Empty = no default.
                    instanceType:
                      type: string
                      description: >-
                        Default broker instance type. Empty = no default.
                        No KropathConfig.msk equivalent.
                    encryptionAtRestKmsKeyId:
                      type: string
                      description: >-
                        Default KMS key for EBS encryption. Empty = no default.
                    encryptionInTransitClientBroker:
                      type: string
                      description: >-
                        Default client-broker encryption mode. Empty = no default.
                    encryptionInTransitInCluster:
                      type: string
                      description: >-
                        Default inter-broker encryption (three-state string: "true", "false").
                        Empty = no default.
                    enhancedMonitoring:
                      type: string
                      description: >-
                        Default CloudWatch monitoring level. Empty = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged MSK governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        kafkaVersion:
                          type: string
                        instanceType:
                          type: string
                        encryptionAtRestKmsKeyId:
                          type: string
                        encryptionInTransitClientBroker:
                          type: string
                        encryptionInTransitInCluster:
                          type: string
                        enhancedMonitoring:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        kafkaVersion:
                          type: string
                        instanceType:
                          type: string
                        encryptionAtRestKmsKeyId:
                          type: string
                        encryptionInTransitClientBroker:
                          type: string
                        encryptionInTransitInCluster:
                          type: string
                        enhancedMonitoring:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
