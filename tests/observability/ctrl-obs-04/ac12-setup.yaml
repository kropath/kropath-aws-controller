#
# AC-12: two statements share a Sid. Uses literal arn: fields (not ref:) so
# the document reaches the Sid-conflict check directly, with no unresolved
# ref muddying this AC's SidConflict-only assertion.
apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac12-doc
  namespace: default
spec:
  statements:
    - sid: "DuplicateSid"
      effect: Allow
      actions: ["s3:GetObject"]
      resources:
        - arn: "arn:aws:s3:::ac12-bucket-a"
    - sid: "DuplicateSid"
      effect: Allow
      actions: ["s3:PutObject"]
      resources:
        - arn: "arn:aws:s3:::ac12-bucket-b"
