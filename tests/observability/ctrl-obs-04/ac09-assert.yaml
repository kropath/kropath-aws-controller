# Assert AC-9: all three refs pending -> SourceNotReady, not the raw pending bool.
apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac09-doc
  namespace: default
status:
  conditions:
    - type: Ready
      status: "False"
      reason: SourceNotReady
    - type: SourceNotReady
      status: "True"
      reason: SourceNotReady
    - type: SidConflict
      status: "False"
      reason: SourceNotReady
