---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: apigatewayconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: APIGatewayConfig
    listKind: APIGatewayConfigList
    plural: apigatewayconfigs
    singular: apigatewayconfig
    shortNames:
      - awsapigwcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.disableExecuteApiEndpoint) &&
                  self.spec.mandatory.disableExecuteApiEndpoint == true &&
                  has(self.spec.defaults) && has(self.spec.defaults.disableExecuteApiEndpoint) &&
                  self.spec.defaults.disableExecuteApiEndpoint == true)
              message: >-
                disableExecuteApiEndpoint cannot be set to true in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.minimumTlsVersion) &&
                  self.spec.mandatory.minimumTlsVersion != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.minimumTlsVersion) &&
                  self.spec.defaults.minimumTlsVersion != "")
              message: >-
                minimumTlsVersion cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.endpointType) &&
                  self.spec.mandatory.endpointType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.endpointType) &&
                  self.spec.defaults.endpointType != "")
              message: >-
                endpointType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.apiKeySource) &&
                  self.spec.mandatory.apiKeySource != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.apiKeySource) &&
                  self.spec.defaults.apiKeySource != "")
              message: >-
                apiKeySource cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory API Gateway governance fields. Zero-value means the field
                    is not enforced at this tier.
                  properties:
                    endpointType:
                      type: string
                      description: >-
                        Enforce the REST API endpoint type. Empty = not enforced.
                        e.g. "REGIONAL" or "EDGE".
                    apiKeySource:
                      type: string
                      description: >-
                        Enforce the API key source for metered APIs. Empty = not enforced.
                        e.g. "HEADER" or "AUTHORIZER".
                    minimumTlsVersion:
                      type: string
                      description: >-
                        Minimum TLS version for custom domain names. Empty = not enforced.
                        e.g. "TLS_1_2".
                    disableExecuteApiEndpoint:
                      type: boolean
                      description: >-
                        Enforce disabling the default execute-api endpoint.
                        true = all APIs must disable the endpoint. false = not enforced.
                    namingTemplate:
                      type: string
                      description: API Gateway resource naming template. Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default API Gateway governance fields. Zero-value means no default
                    is provided at this tier.
                  properties:
                    endpointType:
                      type: string
                      description: Default endpoint type. Empty = no default.
                    apiKeySource:
                      type: string
                      description: Default API key source. Empty = no default.
                    minimumTlsVersion:
                      type: string
                      description: Default minimum TLS version. Empty = no default.
                    disableExecuteApiEndpoint:
                      type: boolean
                      description: Default disableExecuteApiEndpoint setting. false = no default.
                    namingTemplate:
                      type: string
                      description: Default naming template. Empty = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged API Gateway governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        endpointType:
                          type: string
                        apiKeySource:
                          type: string
                        minimumTlsVersion:
                          type: string
                        disableExecuteApiEndpoint:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        endpointType:
                          type: string
                        apiKeySource:
                          type: string
                        minimumTlsVersion:
                          type: string
                        disableExecuteApiEndpoint:
                          type: boolean
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
