# Assert: mandatory.airflowVersion="2.10.3" from KropathConfig level 1;
# defaults.namingTemplate merged in from the global MWAAConfig counterpart
# (level 7) since the local CR sets no defaults of its own.
apiVersion: aws.kropath.run/v1alpha1
kind: MWAAConfig
metadata:
  name: cascade01-mwaa-env
  namespace: cascade01-mwaa-app-ns
status:
  effectiveConfig:
    mandatory:
      airflowVersion: "2.10.3"
    defaults:
      namingTemplate: "mwaa-{namespace}-{name}"
