#
# AC-17: DocumentDBConfig.mandatory.syncedLabels flows to effCfg.mandatory.syncedLabels;
# the RGD applies this as both a K8s label and a cloud tag (not exercised here).
apiVersion: v1
kind: Namespace
metadata:
  name: ac17-docdb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac17-docdb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac17-docdb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac17-docdb-policy
  namespace: ac17-docdb-app-ns
spec:
  mandatory:
    syncedLabels:
      data-class: confidential
