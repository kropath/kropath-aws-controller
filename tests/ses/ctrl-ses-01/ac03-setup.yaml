# AC-3: SESConfig/ac03-ses-config in the global namespace (defaults.namingTemplate
# set) plus SESConfig/ac03-ses-config in the local (app) namespace (no fields of its
# own) plus KropathConfig.mandatory.tags — the local CR's effectiveConfig picks up
# mandatory.tags from KropathConfig and defaults.namingTemplate from the global
# SESConfig counterpart.
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-ses-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac03-ses-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac03-ses-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac03-ses-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: ac03-ses-config
  namespace: ac03-ses-global-ns
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: ac03-ses-config
  namespace: ac03-ses-app-ns
spec: {}
