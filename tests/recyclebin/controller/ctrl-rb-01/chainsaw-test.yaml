# ctrl-rb-01: RecycleBinConfig controller cascade integration tests.
# Covers AC-11 through AC-14 from the EBS Recycle Bin spec:
#   AC-11: mandatory governance fields written to effectiveConfig.mandatory
#   AC-12: lockRule true from global KropathConfig overrides RecycleBinConfig
#   AC-13: tags from KropathConfig.mandatory and RecycleBinConfig.mandatory merge (KPC wins)
#   AC-14: syncedLabels from RecycleBinConfig.mandatory propagate
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied
#   - RecycleBinConfig CRD applied (crds/awsrecyclebinconfig.yaml)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-rb-01-cascade
spec:
  namespace: recyclebin-prod
  namespaceTemplate:
    metadata:
      annotations:
        aws.kropath.run/global-config-namespace: kro-system
        services.k8s.aws/owner-account-id: "123456789012"
        services.k8s.aws/default-region: "us-east-1"
  steps:
    # -----------------------------------------------------------------------
    # ac11: RecycleBinConfig.spec.mandatory.retentionPeriodValue and
    # retentionPeriodUnit are written to effectiveConfig.mandatory.
    # -----------------------------------------------------------------------
    - name: ac11-basic-mandatory-cascade
      try:
        - apply:
            file: ac11-setup.yaml
        - assert:
            file: ac11-assert.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: ac11-setup.yaml

    # -----------------------------------------------------------------------
    # ac12: global KropathConfig.mandatory.ebsrecyclebin.lockRule=true overrides
    # RecycleBinConfig lockRule=false (zero value / not enforced).
    # -----------------------------------------------------------------------
    - name: ac12-lockreule-mandatory-override
      try:
        - apply:
            file: ac12-setup.yaml
        - assert:
            file: ac12-assert.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: ac12-setup.yaml

    # -----------------------------------------------------------------------
    # ac13: tags from KropathConfig.mandatory and RecycleBinConfig.mandatory
    # merge; KPC wins on key conflict.
    # -----------------------------------------------------------------------
    - name: ac13-mandatory-tag-merge
      try:
        - apply:
            file: ac13-setup.yaml
        - assert:
            file: ac13-assert.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: ac13-setup.yaml

    # -----------------------------------------------------------------------
    # ac14: syncedLabels from RecycleBinConfig.spec.mandatory propagate to
    # effectiveConfig.mandatory.syncedLabels.
    # -----------------------------------------------------------------------
    - name: ac14-synced-labels-propagation
      try:
        - apply:
            file: ac14-setup.yaml
        - assert:
            file: ac14-assert.yaml
            timeout: 30s
      cleanup:
        - delete:
            file: ac14-setup.yaml
