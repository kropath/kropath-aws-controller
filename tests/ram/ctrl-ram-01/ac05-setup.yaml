#
# AC-5: KropathConfig.mandatory.ram.allowExternalPrincipals=false (level 1) flows to
# effCfg.mandatory.allowExternalPrincipals, while RAMConfig.defaults.allowExternalPrincipals=true
# (level 6, the resource's own defaults) flows to effCfg.defaults.allowExternalPrincipals —
# the two tiers are resolved independently.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-ram-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-ram-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-ram-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-ram-global-ns
spec:
  mandatory:
    ram:
      allowExternalPrincipals: false
---
apiVersion: aws.kropath.run/v1alpha1
kind: RAMConfig
metadata:
  name: ac05-ram-share
  namespace: ac05-ram-app-ns
spec:
  defaults:
    allowExternalPrincipals: true
