---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: quicksightconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: QuickSightConfig
    listKind: QuickSightConfigList
    plural: quicksightconfigs
    singular: quicksightconfig
    shortNames:
      - awsqscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.importMode) &&
                  self.spec.mandatory.importMode != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.importMode) &&
                  self.spec.defaults.importMode != "")
              message: "importMode cannot be set in both mandatory and defaults"
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: "namingTemplate cannot be set in both mandatory and defaults"
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory QuickSight governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    importMode:
                      type: string
                      description: >-
                        Enforced dataset import mode. Empty = not enforced.
                        Allowed values: SPICE, DIRECT_QUERY.
                        Cannot be set together with defaults.importMode.
                    namingTemplate:
                      type: string
                      description: >-
                        Resource naming template (e.g. "{namespace}-{name}").
                        Empty = not enforced. Cannot be set together with defaults.namingTemplate.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default QuickSight governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    importMode:
                      type: string
                      description: >-
                        Default dataset import mode. Empty = no default.
                        Allowed values: SPICE, DIRECT_QUERY.
                        Cannot be set together with mandatory.importMode.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template (e.g. "{namespace}-{name}").
                        Empty = no default. Cannot be set together with mandatory.namingTemplate.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged QuickSight governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        importMode:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        importMode:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
