#
# AC-10: a ref naming a kind whose CRD is absent. ObsCrdAbsentKind is a
# fictitious kind name -- deliberately not one of the six installed ref kinds
# and not AWSLambdaFunction, since ctrl-dyn-04 installs that CRD dynamically
# earlier in the same chainsaw run (see Makefile's test-chainsaw ordering),
# so a fictitious name is the only kind this suite can rely on staying absent
# regardless of suite execution order.
apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac10-doc
  namespace: default
spec:
  statements:
    - effect: Allow
      actions: ["s3:GetObject"]
      resources:
        - ref:
            kind: ObsCrdAbsentKind
            name: ac10-missing
