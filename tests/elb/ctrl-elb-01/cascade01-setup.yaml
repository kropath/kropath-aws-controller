#
# ELBConfig/cascade01-elb-policy in the global namespace (defaults.namingTemplate set)
# plus ELBConfig/cascade01-elb-policy in the local (app) namespace (no fields of its
# own) plus KropathConfig.mandatory.elb.deletionProtection — the local CR's
# effectiveConfig picks up mandatory.deletionProtection from KropathConfig and
# defaults.namingTemplate from the global ELBConfig counterpart.
apiVersion: v1
kind: Namespace
metadata:
  name: cascade01-elb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: cascade01-elb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: cascade01-elb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: cascade01-elb-global-ns
spec:
  mandatory:
    elb:
      deletionProtection: true
---
apiVersion: aws.kropath.run/v1alpha1
kind: ELBConfig
metadata:
  name: cascade01-elb-policy
  namespace: cascade01-elb-global-ns
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: ELBConfig
metadata:
  name: cascade01-elb-policy
  namespace: cascade01-elb-app-ns
spec: {}
