# Assert AC-16: mandatory.tags contains both "service" (from DocumentDBConfig) and
# "cost-centre" (from KropathConfig); defaults.tags contains "team" (from DocumentDBConfig).
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac16-docdb-policy
  namespace: ac16-docdb-app-ns
status:
  effectiveConfig:
    mandatory:
      tags:
        service: documentdb
        cost-centre: infra
    defaults:
      tags:
        team: platform
