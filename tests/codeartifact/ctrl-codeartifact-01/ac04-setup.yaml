# AC-4: CodeArtifactConfig/ac04-ca-config in the global namespace (defaults.namingTemplate
# set) plus CodeArtifactConfig/ac04-ca-config in the local (app) namespace (no fields of
# its own) plus KropathConfig.mandatory.codeartifact.encryptionKey — the local CR's
# effectiveConfig picks up mandatory.encryptionKey from KropathConfig and
# defaults.namingTemplate from the global CodeArtifactConfig counterpart.
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-ca-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac04-ca-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac04-ca-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac04-ca-global-ns
spec:
  mandatory:
    codeartifact:
      encryptionKey: "arn:aws:kms:ap-southeast-2:123456789012:key/global-key"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CodeArtifactConfig
metadata:
  name: ac04-ca-config
  namespace: ac04-ca-global-ns
spec:
  defaults:
    namingTemplate: "{namespace}-{name}"
---
apiVersion: aws.kropath.run/v1alpha1
kind: CodeArtifactConfig
metadata:
  name: ac04-ca-config
  namespace: ac04-ca-app-ns
spec: {}
