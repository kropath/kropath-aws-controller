---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sqsconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: SQSConfig
    listKind: SQSConfigList
    plural: sqsconfigs
    singular: sqsconfig
    shortNames:
      - awssqscfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.encryptionType) &&
                  self.spec.mandatory.encryptionType != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.encryptionType) &&
                  self.spec.defaults.encryptionType != "")
              message: >-
                encryptionType cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.kmsMasterKeyId) &&
                  self.spec.mandatory.kmsMasterKeyId != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.kmsMasterKeyId) &&
                  self.spec.defaults.kmsMasterKeyId != "")
              message: >-
                kmsMasterKeyId cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.visibilityTimeout) &&
                  self.spec.mandatory.visibilityTimeout > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.visibilityTimeout) &&
                  self.spec.defaults.visibilityTimeout > 0)
              message: >-
                visibilityTimeout cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.messageRetentionPeriod) &&
                  self.spec.mandatory.messageRetentionPeriod > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.messageRetentionPeriod) &&
                  self.spec.defaults.messageRetentionPeriod > 0)
              message: >-
                messageRetentionPeriod cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.delaySeconds) &&
                  self.spec.mandatory.delaySeconds > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.delaySeconds) &&
                  self.spec.defaults.delaySeconds > 0)
              message: >-
                delaySeconds cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.maximumMessageSize) &&
                  self.spec.mandatory.maximumMessageSize > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.maximumMessageSize) &&
                  self.spec.defaults.maximumMessageSize > 0)
              message: >-
                maximumMessageSize cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory SQS governance fields. Zero-value means the field is not
                    enforced at this tier.
                  properties:
                    encryptionType:
                      type: string
                      default: ""
                      description: SQS encryption mode ("kms", "sqs-managed"). Empty string = not enforced.
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: KMS key ID/ARN for SSE-KMS. Empty string = not enforced.
                    visibilityTimeout:
                      type: integer
                      format: int64
                      default: 0
                      description: Message visibility timeout in seconds. 0 = not enforced.
                    messageRetentionPeriod:
                      type: integer
                      format: int64
                      default: 0
                      description: Message retention period in seconds. 0 = not enforced.
                    delaySeconds:
                      type: integer
                      format: int64
                      default: 0
                      description: Message delivery delay in seconds. 0 = not enforced.
                    maximumMessageSize:
                      type: integer
                      format: int64
                      default: 0
                      description: Maximum message size in bytes. 0 = not enforced.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Queue naming template. Empty string = no mandatory naming template.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default SQS governance fields. Zero-value means no default is provided
                    at this tier.
                  properties:
                    encryptionType:
                      type: string
                      default: ""
                      description: Default SQS encryption mode. Empty string = no default.
                    kmsMasterKeyId:
                      type: string
                      default: ""
                      description: Default KMS key ID/ARN. Empty string = no default.
                    visibilityTimeout:
                      type: integer
                      format: int64
                      default: 0
                      description: Default visibility timeout in seconds. 0 = no default.
                    messageRetentionPeriod:
                      type: integer
                      format: int64
                      default: 0
                      description: Default message retention period in seconds. 0 = no default.
                    delaySeconds:
                      type: integer
                      format: int64
                      default: 0
                      description: Default delivery delay in seconds. 0 = no default.
                    maximumMessageSize:
                      type: integer
                      format: int64
                      default: 0
                      description: Default maximum message size in bytes. 0 = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged SQS governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single resources.get() call.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        encryptionType:
                          type: string
                        kmsMasterKeyId:
                          type: string
                        visibilityTimeout:
                          type: integer
                          format: int64
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                        delaySeconds:
                          type: integer
                          format: int64
                        maximumMessageSize:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        encryptionType:
                          type: string
                        kmsMasterKeyId:
                          type: string
                        visibilityTimeout:
                          type: integer
                          format: int64
                        messageRetentionPeriod:
                          type: integer
                          format: int64
                        delaySeconds:
                          type: integer
                          format: int64
                        maximumMessageSize:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
