# AC-9: KropathConfig.mandatory.appScaling.minCapacity=2 (level 1) flows to
# effCfg.mandatory.minCapacity.
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-appscaling-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac09-appscaling-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac09-appscaling-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac09-appscaling-global-ns
spec:
  mandatory:
    appScaling:
      minCapacity: 2
---
apiVersion: aws.kropath.run/v1alpha1
kind: AppScalingConfig
metadata:
  name: ac09-appscaling-policy
  namespace: ac09-appscaling-app-ns
spec: {}
