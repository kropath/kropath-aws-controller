# ctrl-codeartifact-01 Chainsaw integration tests — AC-4, AC-7, AC-8
# (aws-codeartifact-01-codeartifactconfig.md).
#
# Requires a kind cluster with kropath-operator running and the fixture CRDs
# applied (`make chainsaw-start chainsaw-wait`, or just `make test-codeartifact`
# against an already-running controller).
#
# Test isolation — unique-name-per-step, no inter-step deletes:
#   Each AC owns a distinct resource name (acN-ca-config) and its own global/app
#   namespace pair. The controller resolves a config's global counterpart by
#   *name* — a per-AC name isolates each AC completely.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-codeartifact-01
spec:
  description: "CodeArtifact effectiveConfig cascade — AC-4, AC-7, AC-8 (ctrl-codeartifact-01)"
  steps:
    # AC-4: KropathConfig.mandatory.codeartifact.encryptionKey (level 1) flows to
    # effCfg.mandatory.encryptionKey; global CodeArtifactConfig.defaults.namingTemplate
    # (level 7) flows to effCfg.defaults when the local CR sets no defaults of its own.
    - name: ac04-effective-config-merge
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-7: KropathConfig.mandatory.tags + CodeArtifactConfig.mandatory.tags merge
    # additively; CodeArtifactConfig.defaults.tags flows through untouched.
    - name: ac07-tag-merge
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s

    # AC-8: CodeArtifactConfig.mandatory.syncedLabels flows to effCfg.mandatory.syncedLabels.
    - name: ac08-synced-labels
      try:
        - apply:
            file: ac08-setup.yaml
        - assert:
            file: ac08-assert.yaml
            timeout: 30s
