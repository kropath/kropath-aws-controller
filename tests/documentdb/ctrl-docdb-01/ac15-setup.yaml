# AC-15: mandatory.dbInstanceClass ("db.r6g.large") is not present in
# mandatory.allowedInstanceClasses (["db.t3.medium"]) — both set directly on the
# DocumentDBConfig CR's own mandatory tier, no KropathConfig involvement needed.
apiVersion: v1
kind: Namespace
metadata:
  name: ac15-docdb-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac15-docdb-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac15-docdb-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac15-docdb-policy
  namespace: ac15-docdb-app-ns
spec:
  mandatory:
    dbInstanceClass: "db.r6g.large"
    allowedInstanceClasses:
      - "db.t3.medium"
