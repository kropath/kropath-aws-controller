# Assert AC-6: mandatory.tags contains both "cost-centre" (from KropathConfig) and
# "family" (from RAMConfig's own mandatory tags).
apiVersion: aws.kropath.run/v1alpha1
kind: RAMConfig
metadata:
  name: ac06-ram-share
  namespace: ac06-ram-app-ns
status:
  effectiveConfig:
    mandatory:
      tags:
        cost-centre: shared-services
        family: ram
