---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: managedprometheusconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: ManagedPrometheusConfig
    listKind: ManagedPrometheusConfigList
    plural: managedprometheusconfigs
    singular: managedprometheusconfig
    shortNames:
      - awsampcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.alias) &&
                  self.spec.mandatory.alias != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.alias) &&
                  self.spec.defaults.alias != "")
              message: >-
                alias cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.logGroupARN) &&
                  self.spec.mandatory.logGroupARN != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.logGroupARN) &&
                  self.spec.defaults.logGroupARN != "")
              message: >-
                logGroupARN cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory Managed Prometheus governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    alias:
                      type: string
                      description: Workspace alias to enforce. Empty string = not enforced.
                    logGroupARN:
                      type: string
                      description: CloudWatch Logs log group ARN for vended metrics. Empty = not enforced.
                    namingTemplate:
                      type: string
                      description: Workspace naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default Managed Prometheus governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    alias:
                      type: string
                      description: Default workspace alias. Empty string = no default.
                    logGroupARN:
                      type: string
                      description: Default CloudWatch Logs log group ARN. Empty string = no default.
                    namingTemplate:
                      type: string
                      description: >-
                        Default naming template. Empty string = falls back to "{namespace}-{name}".
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged Managed Prometheus governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        alias:
                          type: string
                        logGroupARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        alias:
                          type: string
                        logGroupARN:
                          type: string
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
