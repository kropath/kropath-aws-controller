#
# Assert: mandatory.tags contains both "env" (from MWAAConfig) and "cost-centre"
# (from KropathConfig); defaults.tags contains "team" (from MWAAConfig).
apiVersion: aws.kropath.run/v1alpha1
kind: MWAAConfig
metadata:
  name: cascade02-mwaa-env
  namespace: cascade02-mwaa-app-ns
status:
  effectiveConfig:
    mandatory:
      tags:
        env: prod
        cost-centre: data-platform
    defaults:
      tags:
        team: platform
