# Assert AC-17: mandatory.syncedLabels contains "data-class: confidential".
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac17-docdb-policy
  namespace: ac17-docdb-app-ns
status:
  effectiveConfig:
    mandatory:
      syncedLabels:
        data-class: confidential
