# AC-11: ac11-doc references an unbounded kind (NotAKropathKind). Nine more
# documents each reference a distinct bogus kind -- all ten must bucket to
# kind="other" on the ref metrics, adding no further kind label values.
apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac11-doc
  namespace: default
spec:
  statements:
    - effect: Allow
      actions: ["s3:GetObject"]
      resources:
        - ref:
            kind: NotAKropathKind
            name: ac11-missing
---
apiVersion: aws.kropath.run/v1alpha1
kind: PolicyDocument
metadata:
  name: ac11-bogus-1
  namespace: default
spec:
  statements:
    - effect: Allow
      actions: ["s3:GetObject"]
      resources:
        - ref:
            kind: ObsBogusKind1
            name: ac11-missing
---
