# Assert AC-15: Valid=False, reason=InvalidInstanceClassNotInAllowedList when
# mandatory.dbInstanceClass is not in mandatory.allowedInstanceClasses.
# status.effectiveConfig is withheld (mandatory/defaults stay at zero value).
apiVersion: aws.kropath.run/v1alpha1
kind: DocumentDBConfig
metadata:
  name: ac15-docdb-policy
  namespace: ac15-docdb-app-ns
status:
  conditions:
    - type: "Reconciled"
      status: "True"
      reason: CascadeMerged
    - type: PlacementResolved
      status: "True"
      reason: ResolvedFromNamespace
    - type: "Valid"
      status: "False"
      reason: InvalidInstanceClassNotInAllowedList
    - type: GlobalProfileResolved
      status: "False"
      reason: ProfileUnresolved
  effectiveConfig:
    mandatory: {}
    defaults: {}
