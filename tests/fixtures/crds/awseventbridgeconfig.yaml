---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: eventbridgeconfigs.aws.kropath.run
spec:
  group: aws.kropath.run
  names:
    kind: EventBridgeConfig
    listKind: EventBridgeConfigList
    plural: eventbridgeconfigs
    singular: eventbridgeconfig
    shortNames:
      - awsebcfg
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.archiveRetentionDays) &&
                  self.spec.mandatory.archiveRetentionDays > 0 &&
                  has(self.spec.defaults) && has(self.spec.defaults.archiveRetentionDays) &&
                  self.spec.defaults.archiveRetentionDays > 0)
              message: >-
                archiveRetentionDays cannot be set in both mandatory and defaults
            - rule: >-
                !(has(self.spec.mandatory) && has(self.spec.mandatory.namingTemplate) &&
                  self.spec.mandatory.namingTemplate != "" &&
                  has(self.spec.defaults) && has(self.spec.defaults.namingTemplate) &&
                  self.spec.defaults.namingTemplate != "")
              message: >-
                namingTemplate cannot be set in both mandatory and defaults
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              default: {}
              properties:
                mandatory:
                  type: object
                  default: {}
                  description: >-
                    Mandatory EventBridge governance fields. Zero-value / nil means the field
                    is not enforced at this tier.
                  properties:
                    archiveRetentionDays:
                      type: integer
                      format: int64
                      default: 0
                      description: >-
                        Archive retention days. 0 = not enforced (mandatory) or
                        indefinite retention (defaults).
                    namingTemplate:
                      type: string
                      default: ""
                      description: EventBridge resource naming template (e.g. "{namespace}-{name}"). Empty = not enforced.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                defaults:
                  type: object
                  default: {}
                  description: >-
                    Default EventBridge governance fields. Zero-value / nil means no default
                    is provided at this tier.
                  properties:
                    archiveRetentionDays:
                      type: integer
                      format: int64
                      default: 0
                      description: Default archive retention days. 0 = no default.
                    namingTemplate:
                      type: string
                      default: ""
                      description: Default naming template. Empty string = no default.
                    tags:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedLabels:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
                    syncedAnnotations:
                      type: object
                      default: {}
                      additionalProperties:
                        type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                syncedTimestamp:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                effectiveConfig:
                  type: object
                  description: >-
                    Pre-merged EventBridge governance config written by kropath-aws-controller.
                    RGDs read exclusively from this field via a single externalRef lookup.
                  properties:
                    mandatory:
                      type: object
                      properties:
                        archiveRetentionDays:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    defaults:
                      type: object
                      properties:
                        archiveRetentionDays:
                          type: integer
                          format: int64
                        namingTemplate:
                          type: string
                        tags:
                          type: object
                          additionalProperties:
                            type: string
                        syncedLabels:
                          type: object
                          additionalProperties:
                            type: string
                        syncedAnnotations:
                          type: object
                          additionalProperties:
                            type: string
                    aws:
                      type: object
                      properties:
                        accountId:
                          type: string
                        region:
                          type: string
