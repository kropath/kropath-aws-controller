# AC-5: SESConfig.mandatory.tags + KropathConfig.mandatory.tags merge additively
# into effCfg.mandatory.tags; SESConfig.defaults.tags flows through untouched.
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-ses-global-ns
---
apiVersion: v1
kind: Namespace
metadata:
  name: ac05-ses-app-ns
  annotations:
    aws.kropath.run/global-config-namespace: ac05-ses-global-ns
    services.k8s.aws/owner-account-id: "123456789012"
    services.k8s.aws/default-region: "us-east-1"
---
apiVersion: aws.kropath.run/v1alpha1
kind: KropathConfig
metadata:
  name: baseline
  namespace: ac05-ses-global-ns
spec:
  mandatory:
    tags:
      cost-centre: infra
---
apiVersion: aws.kropath.run/v1alpha1
kind: SESConfig
metadata:
  name: ac05-ses-config
  namespace: ac05-ses-app-ns
spec:
  mandatory:
    tags:
      email-type: transactional
  defaults:
    tags:
      team: platform
