# ctrl-lambda-01 Chainsaw integration tests — 7 acceptance criteria.
# Requires:
#   - kind cluster with kropath-operator deployed
#   - KropathConfig CRD applied (crds/awskropathconfig.yaml from kropath-aws)
#   - LambdaConfig CRD applied (crds/awslambdaconfig.yaml)
#
# Test isolation — unique name per step, no inter-step deletes:
#   Each step owns a distinct set of resource names (ac<N>-*). The controller
#   pairs a namespaced config with its kro-system counterpart by *name*, so a
#   per-step name isolates each step completely — no step can shadow another.
#   See kropath-aws-controller docs/frequent-chainsaw-errors.md §6 for the rationale.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: ctrl-lambda-01-cascade
spec:
  steps:
    # AC-L1: LambdaConfig with empty spec in product namespace reports effective config
    # and condition Valid=True.
    - name: ac-l1-empty-spec-reports-effectiveconfig
      try:
        - apply:
            file: ac01-setup.yaml
        - assert:
            file: ac01-assert.yaml
            timeout: 30s

    # AC-L2: KropathConfig mandatory lambda.runtime="python3.12" (level 1)
    # propagates to effectiveConfig.mandatory.runtime.
    - name: ac-l2-kpc-mandatory-runtime-propagates
      try:
        - apply:
            file: ac02-setup.yaml
        - assert:
            file: ac02-assert.yaml
            timeout: 30s

    # AC-L3: LambdaConfig mandatory memorySize=512 (level 4)
    # propagates to effectiveConfig.mandatory.memorySize.
    - name: ac-l3-local-mandatory-memorysize-propagates
      try:
        - apply:
            file: ac03-setup.yaml
        - assert:
            file: ac03-assert.yaml
            timeout: 30s

    # AC-L4: LambdaConfig defaults tracingMode="Active" (level 6)
    # propagates to effectiveConfig.defaults.tracingMode.
    - name: ac-l4-local-defaults-tracingmode-propagates
      try:
        - apply:
            file: ac04-setup.yaml
        - assert:
            file: ac04-assert.yaml
            timeout: 30s

    # AC-L5: LambdaConfig defaults namingTemplate (level 6)
    # propagates to effectiveConfig.defaults.namingTemplate.
    - name: ac-l5-local-defaults-namingtpl-propagates
      try:
        - apply:
            file: ac05-setup.yaml
        - assert:
            file: ac05-assert.yaml
            timeout: 30s

    # AC-L6: Provider identity (aws.accountId, aws.region) from KropathConfig
    # propagates to effectiveConfig.aws.
    - name: ac-l6-provider-identity-propagates
      try:
        - apply:
            file: ac06-setup.yaml
        - assert:
            file: ac06-assert.yaml
            timeout: 30s

    # AC-L7: Tags union-merge across mandatory levels 3+4; level-3 (global LambdaConfig) wins on conflict.
    - name: ac-l7-tag-union-merge
      try:
        - apply:
            file: ac07-setup.yaml
        - assert:
            file: ac07-assert.yaml
            timeout: 30s
